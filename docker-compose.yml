# Runs the whole stack locally the same way it runs in AWS: three
# containerised services plus Postgres. Useful as a rehearsal — if this
# works, the ECS deployment is the same images with RDS swapped in for the
# postgres container and STORAGE_DRIVER set to s3.
#
#   docker compose up --build
#
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-leadpulse_dev}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: leadpulse-api/Dockerfile
    env_file: .env
    environment:
      DB_HOST: postgres
      UPLOAD_SERVICE_URL: http://upload-service:4001
      EMAIL_SERVICE_URL: http://email-service:4002
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 10s
      timeout: 5s
      retries: 3

  upload-service:
    build:
      context: .
      dockerfile: leadpulse-upload-service/Dockerfile
    env_file: .env
    environment:
      DB_HOST: postgres
    # Not published to the host: this service is internal-only and should
    # only ever be reachable by the API, never from a browser.
    expose:
      - '4001'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4001/health']
      interval: 10s
      timeout: 5s
      retries: 3

  email-service:
    build:
      context: .
      dockerfile: leadpulse-email-service/Dockerfile
    env_file: .env
    environment:
      DB_HOST: postgres
    expose:
      - '4002'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4002/health']
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
